const GW = 256, GH = 240, PLAY0 = 186, BASE0 = 172;   // design frame; BASE0 = ground y for height 0
let W = GW, H = GH, PLAY_H = PLAY0, BASE = BASE0;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');   // swapped briefly when drawing the share card

// Fill the safe-area viewport edge-to-edge (no black letterbox). Grow the logical canvas to match
// the aspect ratio so we extend sky/grass (portrait) or the course sideways (wide), keeping crisp nearest-neighbor pixels. Integer device-pixel snap when it costs <8%.
function cssPx(v) { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; }
function viewportCssSize() {
  // Fill the layout / dvh box so grass reaches the bottom edge (no body-blue strip under Safari toolbars).
  // Prefer the larger of visualViewport and layout viewport; never shorter than the fixed body.
  const vv = window.visualViewport;
  const iw = Math.max(1, Math.round(window.innerWidth || document.documentElement.clientWidth || 1));

  const aw = Math.max(1, iw, vw);

}
function safeCssInsets() {

  let r = cssPx(bs.getPropertyValue('--sar'));
  let b = cssPx(bs.getPropertyValue('--sab'));

      document.body.appendChild(probe);

  }

  // Floor the top inset so gear/FS clear the iOS status bar (~47 CSS px on notch phones).
  let standalone = false;

  return { t, r, b, l };
}

function resize() {
  const { aw, ah } = viewportCssSize();
  const aspect = aw / ah, design = GW / GH;
  let lw, lh;
  if (aspect >= design) { lh = GH; lw = Math.max(GW, Math.round(GH * aspect)); }

  const dpr = window.devicePixelRatio || 1;

  const inset = safeCssInsets();
  SAFE = { t: Math.round(inset.t / sc), r: Math.round(inset.r / sc), b: Math.round(inset.b / sc), l: Math.round(inset.l / sc) };

    // CSS keeps canvas inset:0 / 100% — do not shrink style height below the body

  const HUD_H = 54;

/* ================= LEADERBOARD STORAGE (all score storage lives in this block) =================
   saveScore(entry)  entry = { name, strokes, to_par, created_at }
   loadScores()      -> top 10, best first: [{ name, strokes, to_par, created_at }, ...]
   Uses Supabase REST when LEADERBOARD_CONFIG is filled in, otherwise localStorage.
   Any online error falls back to localStorage, so a finished round is never lost. */
const LB_LOCAL_KEY = 'dlg_golf_scores9', LB_LOCAL_MAX = 100, LB_TIMEOUT_MS = 8000;
let lbSource = 'device';   // where the last loadScores() result came from: 'online' | 'device'
const lbOnline = () => !!(LEADERBOARD_CONFIG.supabaseUrl && LEADERBOARD_CONFIG.supabaseAnonKey);
const lbEndpoint = () => String(LEADERBOARD_CONFIG.supabaseUrl).trim().replace(/\/+$/, '') + '/rest/v1/scores';
function lbHeaders(extra) { const k = String(LEADERBOARD_CONFIG.supabaseAnonKey).trim(); return Object.assign({ apikey: k, Authorization: 'Bearer ' + k }, extra || {}); }
function lbFetch(url, opts) {
  const ac = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ac ? setTimeout(() => ac.abort(), LB_TIMEOUT_MS) : 0;
  return fetch(url, Object.assign({}, opts, ac ? { signal: ac.signal } : {})).finally(() => clearTimeout(timer));
}
function lbClean(e) {
  if (!e) return null;
  const name = cleanName(e.name), strokes = Math.round(Number(e.strokes)), to_par = Math.round(Number(e.to_par));
  if (!name || !(strokes >= 1 && strokes <= 200) || !isFinite(to_par)) return null;
  const mode = e.mode == null || e.mode === '' ? null : String(e.mode);
  return { name, strokes, to_par, created_at: String(e.created_at || ''), mode };
}
let lbModeOk = null;   // null unknown, true column present, false missing (degrade to local for mode buckets)
async function lbProbeMode() {
  if (lbModeOk != null || !lbOnline()) { if (!lbOnline()) lbModeOk = false; return lbModeOk; }
  try {
    const r = await lbFetch(lbEndpoint() + '?select=mode&limit=1', { headers: lbHeaders() });
    if (r.ok) { lbModeOk = true; return true; }
    const t = await r.text();
    if (/PGRST204|42703|does not exist|schema cache/i.test(t)) { lbModeOk = false; return false; }
    // 'mode' aggregate quirk without column also => false
    if (/WITHIN GROUP|ordered-set aggregate/i.test(t)) { lbModeOk = false; return false; }
    lbModeOk = false; return false;
  } catch (e) { lbModeOk = false; return false; }
}
const lbSort = (a, b) => a.to_par - b.to_par || a.strokes - b.strokes || (a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0);
function lbLocalAll() { try { const a = JSON.parse(localStorage.getItem(LB_LOCAL_KEY) || '[]'); return Array.isArray(a) ? a.map(lbClean).filter(Boolean) : []; } catch (e) { return []; } }
function lbLocalSave(e) { const all = lbLocalAll(); all.push(e); all.sort(lbSort); try { localStorage.setItem(LB_LOCAL_KEY, JSON.stringify(all.slice(0, LB_LOCAL_MAX))); } catch (err) {} }
function lbLocalKey(mode) {
  if (!mode || mode === 'front9') return LB_LOCAL_KEY;
  return LB_LOCAL_KEY + '__' + mode;
}
function lbLocalAllMode(mode) {
  try { const a = JSON.parse(localStorage.getItem(lbLocalKey(mode)) || '[]'); return Array.isArray(a) ? a.map(lbClean).filter(Boolean) : []; } catch (e) { return []; }
}
function lbLocalSaveMode(e, mode) {
  const m = mode || e.mode || null;
  const all = lbLocalAllMode(m); all.push(Object.assign({}, e, { mode: m })); all.sort(lbSort);
  try { localStorage.setItem(lbLocalKey(m), JSON.stringify(all.slice(0, LB_LOCAL_MAX))); } catch (err) {}
}
async function saveScore(entry) {
  const e = lbClean(Object.assign({ created_at: new Date().toISOString() }, entry));
  if (!e) return { ok: false, where: 'none' };
  const mode = entry.mode != null ? entry.mode : e.mode;
  e.mode = mode || null;
  // Front 9 classic: omit mode so it stays on the main board when column is absent
  const isClassic = !mode || mode === 'front9';
  if (lbOnline()) {
    try {
      await lbProbeMode();
      const body = { name: e.name, strokes: e.strokes, to_par: e.to_par };
      if (!isClassic) {
        if (lbModeOk !== true) { lbLocalSaveMode(e, mode); return { ok: true, where: 'device', pendingMode: true }; }
        body.mode = mode;
      } else if (lbModeOk === true) {
        body.mode = 'front9';
      }
      const r = await lbFetch(lbEndpoint(), { method: 'POST', headers: lbHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
        body: JSON.stringify(body) });
      if (!r.ok) {
        const t = await r.text();
        if (!isClassic && /PGRST204|42703|mode/i.test(t)) { lbModeOk = false; lbLocalSaveMode(e, mode); return { ok: true, where: 'device', pendingMode: true }; }
        throw new Error('HTTP ' + r.status);
      }
      return { ok: true, where: 'online' };
    } catch (err) { /* fall through */ }
  }
  lbLocalSaveMode(e, isClassic ? null : mode);
  return { ok: true, where: 'device' };
}
function lbModeFilter(mode) {
  const isClassic = !mode || mode === 'front9';
  if (isClassic) return 'or=(mode.eq.front9,mode.is.null)';
  if (!/^[a-z0-9-]+$/i.test(mode)) return null;
  return 'mode=eq.' + mode;
}
async function loadScores(mode) {
  const want = mode || null;   // null/'front9' = main board
  const isClassic = !want || want === 'front9';
  if (lbOnline()) {
    try {
      await lbProbeMode();
      let q = '?select=name,strokes,to_par,created_at&order=to_par.asc,strokes.asc&limit=10';
      if (lbModeOk === true) {
        const filt = lbModeFilter(isClassic ? 'front9' : want);
        q = filt
          ? '?select=name,strokes,to_par,created_at,mode&' + filt + '&order=to_par.asc,strokes.asc&limit=10'
          : '?select=name,strokes,to_par,created_at,mode&order=to_par.asc,strokes.asc&limit=40';
      }
      let r = await lbFetch(lbEndpoint() + q, { headers: lbHeaders() });
      // Older APIs reject the mode filter — fall back to a mixed top slice and filter here.
      if (!r.ok && lbModeOk === true) {
        r = await lbFetch(lbEndpoint() + '?select=name,strokes,to_par,created_at,mode&order=to_par.asc,strokes.asc&limit=40', { headers: lbHeaders() });
      }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      let rows = await r.json();
      if (!Array.isArray(rows)) throw new Error('bad data');
      rows = rows.map(lbClean).filter(Boolean);
      if (lbModeOk === true) {
        if (isClassic) rows = rows.filter(x => !x.mode || x.mode === 'front9');
        else rows = rows.filter(x => x.mode === want);
      } else if (!isClassic) {
        lbSource = 'device';
        return { rows: lbLocalAllMode(want).sort(lbSort).slice(0, 10), pendingMode: true };
      }
      lbSource = 'online';
      return { rows: rows.slice(0, 10), pendingMode: false };
    } catch (err) { /* fall back */ }

}

const TRACK_VISITOR_KEY = 'dlg_visitor_v1';
function trackEnabled() { return lbOnline() && !/^#(test|preview)/.test(location.hash || ''); }
function trackVisitorId() {
  try {
    let id = localStorage.getItem(TRACK_VISITOR_KEY);
    if (id && /^[a-zA-Z0-9_-]{8,64}$/.test(id)) return id;
    const a = new Uint8Array(16);
    (crypto.getRandomValues ? crypto.getRandomValues(a) : a).forEach((_, i) => { if (!crypto.getRandomValues) a[i] = (Math.random() * 256) | 0; });
    id = Array.from(a, b => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
    localStorage.setItem(TRACK_VISITOR_KEY, id);
    return id;
  } catch (e) { return 'anon'; }
}
function trackDevice() {
  const w = Math.min(screen.width || W, screen.height || H);
  if (w <= 520) return 'phone';
  if (w <= 900) return 'tablet';
  return 'desktop';
}
function trackOs() {
  const ua = navigator.userAgent || '';
  if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
  if (/Android/i.test(ua)) return 'android';
  if (/Mac OS X|Macintosh/i.test(ua)) return 'macos';
  if (/Windows/i.test(ua)) return 'windows';
  if (/Linux/i.test(ua)) return 'linux';
  return 'other';
}
function trackBrowser() {
  const ua = navigator.userAgent || '';
  if (/Edg\//.test(ua)) return 'edge';
  if (/OPR\/|Opera/i.test(ua)) return 'opera';
  if (/Chrome\//.test(ua) && !/Edg\//.test(ua)) return 'chrome';
  if (/Safari\//.test(ua) && !/Chrome\//.test(ua)) return 'safari';
  if (/Firefox\//.test(ua)) return 'firefox';
  return 'other';
}
function trackStandalone() {

    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    if (navigator.standalone) return true;
  } catch (e) {}

}
function trackReferrerHost() {

  } catch (e) { return ''; }
}
function trackScreen() {

}
function trackTz() {

}

}
function trackEvent(event, extra) {

  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (!inBlobs(x, y, blobs)) continue;
    const edge = !inBlobs(x - 1, y, blobs) || !inBlobs(x + 1, y, blobs) || !inBlobs(x, y - 1, blobs) || !inBlobs(x, y + 1, blobs);
    let c = main;

    g.fillStyle = c; g.fillRect(x, y, 1, 1);

    if (v && typeof v === 'object') return v;
  } catch (e) {}

function grantAch(id, toastMsg) {
  if (!unlocks.ach) unlocks.ach = {};
  if (unlocks.ach[id]) return false;
  unlocks.ach[id] = Date.now();
  // unlock rewards
  if (id === 'birdie' && !unlocks.trails.includes('gold')) unlocks.trails.push('gold');
  if (id === 'eagle' && !unlocks.hats.includes(10)) unlocks.hats.push(10);
  if (id === 'under' && !unlocks.trails.includes('fire')) unlocks.trails.push('fire');
  if (id === 'ace') { if (!unlocks.trails.includes('dlg')) unlocks.trails.push('dlg'); if (!unlocks.hats.includes(11)) unlocks.hats.push(11); }
  if (id === 'daily3' && !unlocks.trails.includes('rainbow')) unlocks.trails.push('rainbow');
  saveUnlocks();
  showToast(['UNLOCKED!', toastMsg || id.toUpperCase()], 3200);
  SFX.cheer && SFX.cheer();
  return true;

const PW_SPEED = 1 / 0.95, ACC_SPEED = 1.1, ACC_MIN = -0.12;

    // Do not let ridge peaks climb above ridgeBase into the board/sky gap

}

  let bob = Math.round(Math.sin(st * (Math.PI * 2 / 3)) * 2.5);
  if (LOGO_Y + bob < iconClear) bob = iconClear - LOGO_Y;
  if (LOGO_BIG.complete) ctx.drawImage(LOGO_BIG, LOGO_DRAW.x, LOGO_Y + bob, LOGO_DRAW.w, LOGO_DRAW.h);

  menuRects = [];
  const GAP = MENU.length > 2 ? 22 : 36, widths = MENU.map(l => textW(l, 2));
  const rowW = widths.reduce((a, b) => a + b, 0) + GAP * Math.max(0, MENU.length - 1);
  let mx = Math.round((W - rowW) / 2);

    const w = widths[i], sel = i === titleSel && !menuPopup && !ov, x = mx, y = MENU_Y0;
    const key = 'menu' + i, dim = pressDim(key);
    const sc = pressScale(key);
    ctx.save();
    if (sc !== 1) { const cx = x + w / 2, cy = y + 7; ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-cx, -cy); }
    outlined(label, x, y, dim ? '#f8d878' : (sel ? '#f8d878' : COL.white), 2);
    if (sel) outlined('>', x - 15 + (Math.floor(st * 4) % 2), y, '#f8d878', 2);
    ctx.restore();
    menuRects.push({ x: x - 10, y: y - 2, w: w + 20, h: MENU_DY, i });
    mx += w + GAP;
  });
  drawTitleBoard();
  const d = titleDog, f = Math.floor(st * 7) % 2;
  const k = (d.sniff > 0 ? (f ? 'sniffA' : 'sniffB') : (f ? 'walkB' : 'walkA')) + (d.dir < 0 ? 'L' : '');
  const dogBot = H - 4 - (SAFE.b || 0);
  const dogY = (H > W * 1.15)
    ? Math.min(dogBot - 18, TITLE_FAIR + Math.max(4, Math.round((H - TITLE_FAIR - 18) * 0.35)))
    : Math.min(dogBot - 18, TITLE_FAIR + Math.max(2, Math.round((H - TITLE_FAIR - 20) / 2)));
  ctx.drawImage(SPR[k], Math.max(2, Math.min(W - 28, Math.round(d.x))), dogY);

}
