/* =========================================================

   Single file, no network. 256x240 logical resolution.
   ========================================================= */
const GW = 256, GH = 240, PLAY0 = 186, BASE0 = 172;   // design frame; BASE0 = ground y for height 0
let W = GW, H = GH, PLAY_H = PLAY0, BASE = BASE0;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');   // swapped briefly when drawing the share card
ctx.imageSmoothingEnabled = false;
// Fill the safe-area viewport edge-to-edge (no black letterbox). Grow the logical canvas to match
// the aspect ratio so we extend sky/grass (portrait) or the course sideways (wide), keeping crisp nearest-neighbor pixels. Integer device-pixel snap when it costs <8%.
function cssPx(v) { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; }
function viewportCssSize() {
  // Prefer visualViewport (Safari toolbars) then innerHeight/Width — full bleed including safe areas.
  const vv = window.visualViewport;
  const aw = Math.max(1, Math.round((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth || 1));
  const ah = Math.max(1, Math.round((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight || 1));
  return { aw, ah };
}
function safeCssInsets() {
  const bs = getComputedStyle(document.body);
  return {
    t: cssPx(bs.getPropertyValue('--sat')),
    r: cssPx(bs.getPropertyValue('--sar')),
    b: cssPx(bs.getPropertyValue('--sab')),
    l: cssPx(bs.getPropertyValue('--sal'))
  };
}
let SAFE = { t: 0, r: 0, b: 0, l: 0 };   // logical-px safe insets (chrome offsets)
function resize() {
  const { aw, ah } = viewportCssSize();
  const aspect = aw / ah, design = GW / GH;
  let lw, lh;
  if (aspect >= design) { lh = GH; lw = Math.max(GW, Math.round(GH * aspect)); }
  else { lw = GW; lh = Math.max(GH, Math.round(GW / aspect)); }
  // snap CSS scale toward integer device pixels for crispness
  const dpr = window.devicePixelRatio || 1;
  let sc = Math.min(aw / lw, ah / lh);
  let dev = sc * dpr; const fl = Math.floor(dev); if (fl >= 1 && fl / dev >= 0.92) { dev = fl; sc = dev / dpr; lw = Math.max(GW, Math.round(aw / sc)); lh = Math.max(GH, Math.round(ah / sc)); }
  const inset = safeCssInsets();
  SAFE = { t: Math.round(inset.t / sc), r: Math.round(inset.r / sc), b: Math.round(inset.b / sc), l: Math.round(inset.l / sc) };
  if (lw === W && lh === H && cv.width === lw && cv.height === lh) {
    cv.style.width = aw + 'px'; cv.style.height = ah + 'px';
    layoutChrome();
    return;
  }
  W = lw; H = lh;
  // HUD docks at the bottom (design HUD = 54px). Extra tall height → sky above + dirt under the fairway.
  const HUD_H = 54;
  PLAY_H = Math.max(PLAY0, H - HUD_H);
  const dirtBand = PLAY0 - BASE0;            // 14px dirt under tee line (original framing)
  const extraPlay = Math.max(0, PLAY_H - PLAY0);
  BASE = BASE0 + Math.floor(extraPlay * 0.55);
  if (BASE > PLAY_H - dirtBand) BASE = PLAY_H - dirtBand;
  // Portrait play: pin the fairway line near 64% of the full viewport (sky above, dirt down to HUD)
  if (H > W * 1.15) {
    const want = Math.round(H * 0.64);
    BASE = clamp(want, Math.round(H * 0.58), PLAY_H - Math.max(dirtBand, 28));
  }
  cv.width = W; cv.height = H;
  ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  cv.style.width = aw + 'px'; cv.style.height = ah + 'px';
  layoutChrome();
}

function showToast(lines, ms = 4500) { toast = { lines, until: performance.now() + ms }; }
function toggleFullscreen() {
  if (!fsSupported) {   // iPhone Safari: no fullscreen API; the page already fills the screen, home-screen launch hides the bars

  } catch (e) {}
}
